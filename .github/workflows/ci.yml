name: ci

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 读取 Node 版本
        id: node
        run: echo "version=$(cat .node-version)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.node.outputs.version }}
          cache: npm

      - name: 安装依赖（frozen）
        run: npm ci

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: ESLint
        run: npx --no-install eslint .

      - name: Prettier
        run: npx --no-install prettier --check .

      - name: 链接校验
        run: python scripts/check-markdown-links.py . --fragments
        env:
          PYTHONIOENCODING: utf-8

      - name: 行尾校验
        run: python scripts/check-line-endings.py .
        env:
          PYTHONIOENCODING: utf-8
