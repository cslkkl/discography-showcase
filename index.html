<!DOCTYPE html>
<html lang="zh-Hant" data-lang="t" class="ld-booting">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>聲之年輪 · 歌手唱片陳列</title>
<meta name="description" content="聲之年輪：以年輪與數據陳列歌手的完整錄音室目錄。選擇一位歌手，走進他的唱片年輪。">
<meta name="theme-color" content="#08080A">
<meta name="color-scheme" content="dark">
<meta property="og:title" content="聲之年輪 · 歌手唱片陳列">
<meta property="og:description" content="選擇一位歌手，走進他的唱片年輪。">
<meta property="og:type" content="website">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/fonts/fonts.css?v=cc4611c1">
<link rel="stylesheet" href="css/style.css?v=cc4611c1">
</head>
<body>

<a class="skip" href="#ldShelf">跳至歌手選擇</a>

<div class="grain" aria-hidden="true"></div>

<main id="top" class="ld-main">

  <!-- 入口：立體唱片架 -->
  <section class="ld-hero">

    <div class="ld-inner ld-brandrow">
      <!-- 品牌銘牌：印章 + 三行銘文（站名／英文題名／起始年）。
           起始年由 landing.js 取全站最早的統計年份填入，不寫死 -->
      <p class="ld-brand">
        <span class="ld-seal" aria-hidden="true">
          <svg viewBox="0 0 100 100" role="presentation"><text x="50" y="52" text-anchor="middle" dominant-baseline="central">聲</text></svg>
        </span>
        <span class="ld-mark">
          <span class="ld-brandname">聲之年輪</span>
          <span class="ld-branden">SOUND ARCHIVE</span>
          <span class="ld-est"></span>
        </span>
      </p>
      <button class="lang ld-lang" id="ldLang" type="button" aria-label="切換繁體與簡體">
        <span class="lang-opt" data-opt="s">簡</span><span class="lang-opt" data-opt="t">繁</span>
      </button>
    </div>

    <div class="ld-shelf" id="ldShelf">

      <div class="ld-stage" id="ldStage" role="group" aria-label="歌手封面組">
        <span class="ld-glow" aria-hidden="true"></span>
        <ul class="ld-groups" id="ldGroups"></ul>
      </div>

      <div class="ld-inner ld-info">
        <p class="ld-en" id="ldEn"></p>
        <h2 class="ld-name" id="ldName"></h2>
        <p class="ld-stats" id="ldStats"></p>
        <p class="ld-span" id="ldSpan"><span class="ld-sp-y"></span><span class="ld-sp-line" aria-hidden="true"></span><span class="ld-sp-y"></span></p>
        <p class="ld-note" id="ldNote"></p>
        <a class="ld-cta" id="ldCta" href="#"><span class="ld-cta-arrow" aria-hidden="true">→</span></a>
      </div>

      <div class="ld-inner ld-controls" id="ldControls" role="group" aria-label="切換歌手">
        <ul class="ld-tabs" id="ldTabs"></ul>
      </div>

      <p class="ld-hint">點兩側封面切換，點中央封面進入專輯</p>
      <p class="ld-sr" id="ldLive" role="status" aria-live="polite"></p>

    </div>

    <p class="ld-empty" id="ldEmpty" hidden>目前沒有可顯示的歌手資料。</p>

  </section>

</main>

<footer class="ld-foot">
  <div class="ld-inner">
    <p>聲之年輪 · 個人非商業收藏陳列。封面與錄音權利屬各自權利人。</p>
  </div>
</footer>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script src="js/data.js?v=cc4611c1"></script>
<script src="js/landing.js?v=cc4611c1"></script>
</body>
</html>
